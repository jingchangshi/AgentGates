# AgentGates V2 — 本机配置示例

复制到 `~/.config/agent-gates/config.toml` 并修改路径。
完整字段说明见 `config-schema.md`。

```toml
schema_version = 1

state_root    = "/home/CHANGEME/.local/state/agent-gates/v2"
evidence_root = "/home/CHANGEME/.local/state/agent-gates/v2/evidence"
# lock_root 可省略，默认 <state_root>/locks

# ── adapters ────────────────────────────────────────────────────────────────
# Adapter 读取的 env 文件是机器事实，不是请求参数。
# 三个 adapter 都一样：机器参数只从 env_file 读，启动环境不是配置来源。
# env_file 可省略，此时按包内 adapters/<id>/env.sh 查找。
[adapters.ascendnpu-ir]
env_file = "/path/to/AgentGates/agent_gates/adapters/ascendnpu-ir/env.sh"

[adapters.tilelang-hivm]
env_file = "/path/to/AgentGates/agent_gates/adapters/tilelang-hivm/env.sh"

[adapters.tilelang-hivm-npu]
env_file = "/path/to/AgentGates/agent_gates/adapters/tilelang-hivm/env.sh"

# ── workspaces ──────────────────────────────────────────────────────────────
# 只有登记过的源码树才能被 Gate 使用。
[workspaces.ascendnpu-ir]
source_root = "/home/CHANGEME/work/AscendNPU-IR"
adapters = ["ascendnpu-ir"]

[workspaces.tilelang]
source_root = "/home/CHANGEME/work/tilelang"
adapters = ["tilelang-hivm", "tilelang-hivm-npu"]
# 可选：限制该 workspace 可运行的 Gate
# allowed_gates = ["tilelang-hivm-build", "tilelang-hivm-regression"]

# ── worker ──────────────────────────────────────────────────────────────────
[worker]
backend = "systemd"          # 唯一后端；不提供 in-process 退化
max_concurrent = 2
python = "/path/to/AgentGates/.venv/bin/python"
start_timeout_seconds = 60

# ── devices ─────────────────────────────────────────────────────────────────
# 本机所有 NPU 默认可用。共享卡是正常状态：别人在用某张卡不代表该卡被独占。
# 整个 [devices] 段都可以省略——省略即全部可用，并选择设备 0。
[devices]
smi_command = "npu-smi"

# 可选：限制可用卡
# allowed_npu_devices = [0, 1]

# 可选：固定选择（须同时出现在上面的允许列表里）
# default_npu_device = 1

# 可选：要求独占卡。适合对时序/显存敏感的测试；被占用的卡会报 BLOCKED_ENV。
# require_exclusive_device = true
```
