[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gates"
version = "0.1.0"
description = "Standalone deterministic compiler engineering gates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-gates = "agent_gates.cli:main"

[tool.setuptools.packages.find]
include = ["agent_gates*"]

[tool.setuptools.package-data]
# Deployment files (Dockerfile, entry.sh, create-container.sh and the
# all-empty config.example.env) ship too: a reader of an installed wheel must
# be able to create the container the Adapters address. A real config.env is
# never packaged, because it is not named here and is git-ignored.
agent_gates = ["adapters/*/manifest.json", "adapters/*/scripts/*", "adapters/*/env.example.sh",
               "adapters/*/README.md", "adapters/*/docker/*"]
