[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gates"
version = "0.1.0"
description = "Standalone deterministic compiler engineering gates"
requires-python = ">=3.11"
# pydantic carries the versioned agent-facing API contract; mcp is the stdio
# server that exposes the same contract to DSH. Both are pinned by major
# version: the API models and the MCP schemas are a published contract.
dependencies = [
  "pydantic>=2.6,<3",
  "mcp>=1.10,<3",
]

[project.scripts]
agent-gates = "agent_gates.cli:main"

[tool.setuptools.packages.find]
include = ["agent_gates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
# Deployment files (Dockerfile, entry.sh, create-container.sh and the
# all-empty config.example.env) ship too: a reader of an installed wheel must
# be able to create the container the Adapters address. The docker/ entries are
# named one at a time rather than matched with `docker/*`, because that glob
# also matched a real machine `config.env` sitting beside the template, and
# git-ignore rules do not keep a file out of package-data. Keep this list in
# step with the files the Adapters actually ship.
#
# The ForgeKernel Adapter ships a patch series and a task definition as well as
# its gate: an installed Pack must carry the patches it applies and the task it
# runs, or the wheel would install an Adapter that cannot do its job. Those are
# named by directory pattern (not one file at a time) because the series is
# expected to grow; they contain no machine data, unlike a real `config.env`.
agent_gates = ["adapters/*/manifest.json", "adapters/*/scripts/*", "adapters/*/env.example.sh",
               "adapters/*/README.md",
               "adapters/*/patches/*", "adapters/*/tasks/*/*",
               "adapters/*/docker/Dockerfile", "adapters/*/docker/entry.sh",
               "adapters/*/docker/create-container.sh", "adapters/*/docker/config.example.env",
               "adapters/*/docker/README.md"]
